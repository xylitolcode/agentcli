{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentcli · web console</title>
{% for href in vite.css %}<link rel="stylesheet" href="{% static href %}">
{% endfor %}</head>
<body>
<div id="root"></div>
{{ bootstrap|json_script:"bootstrap" }}
{% if vite.js %}<script type="module" src="{% static vite.js %}"></script>
{% else %}<p style="padding:24px;color:#d29922;font:14px/1.8 ui-monospace,monospace">
  前端还没构建。在 <code>frontend/</code> 下跑 <code>npm run build</code>，然后刷新本页。
</p>{% endif %}
</body>
</html>
